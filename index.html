<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自己紹介ページ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">About Me</p>
        <h1>こんにちは、[あなたの名前]です。</h1>
        <p class="lead">
          ここは私の自己紹介ページです。やわらかい雰囲気で、落ち着いて読める構成にしています。
        </p>
      </header>

      <section class="panel">
        <h2>プロフィール</h2>
        <dl class="profile">
          <div>
            <dt>名前</dt>
            <dd>[あなたの名前]</dd>
          </div>
          <div>
            <dt>出身</dt>
            <dd>[出身地]</dd>
          </div>
          <div>
            <dt>職業 / 学業</dt>
            <dd>[職業や学校名]</dd>
          </div>
          <div>
            <dt>趣味</dt>
            <dd>[趣味をいくつか]</dd>
          </div>
        </dl>
      </section>

      <section class="panel soft">
        <h2>好きなこと</h2>
        <ul class="list">
          <li>[例] 音楽を聴くこと</li>
          <li>[例] 旅行すること</li>
          <li>[例] コーディングやデザインを触ること</li>
        </ul>
      </section>

      <section class="panel accent">
        <h2>ひとこと</h2>
        <p>
          [ここに自己紹介の一文を入れてください。]
        </p>
      </section>
    </main>
  </body>
</html>
